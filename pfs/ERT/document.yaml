title: Earth Radiance Temperature
version: 5.6.0
type: SAR
applies_to: Data collected by Earth Radiance Temperature is normally used for temperature radiance measurement.
background: |-
  This PFS is specifically aimed at users interested in exploring the potential of SAR but who may lack the expertise or facilities for SAR processing.
